<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>授業管理</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <h1>授業管理</h1>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ security_csrf_token() }}">
      <p>授業名</p>

      <input type="text" name="course_name" required />

      <br /><br />

      <button type="submit">追加</button>
    </form>

    <hr />

    <h2>登録済み授業</h2>

    {% for course in courses %}

    <div class="course-item">
      <a href="{{ url_for('lecture', course_id=course.id) }}">
        <button>{{ course.name }}</button>
      </a>

      {% if course_average_scores[course.id] is not none %}

      <span class="course-score">
        平均得点率：{{ course_average_scores[course.id] }}%
      </span>

      {% else %}

      <span class="course-score"> 平均得点率：未実施 </span>

      {% endif %}
      <form
        method="POST"
        action="{{ url_for('delete_course', course_id=course.id) }}"
        data-course-name="{{ course.name }}"
        onsubmit="return confirm('「' + this.dataset.courseName + '」を本当に削除しますか？\n全15回の講義・分析内容・チャット履歴・テスト結果も削除され、元に戻せません。');"
      >
        <input type="hidden" name="csrf_token" value="{{ session['course_delete_token'] }}" />
        <button type="submit" class="delete-button">削除</button>
      </form>
    </div>

    {% endfor %}
    <script src="{{ url_for('static', filename='js/list-refresh.js') }}"></script>
  </body>
</html>
