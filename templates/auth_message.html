{% extends 'base.html' %}
{% block title %}アカウントのご案内 | 単位トルトル君{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block main_class %}auth-utility-main{% endblock %}
{% block content %}
<section class="auth-card auth-card-standalone" aria-labelledby="message-title">
  <p class="eyebrow">ACCOUNT SUPPORT</p>
  <h1 class="page-title" id="message-title">アカウントのご案内</h1>
  <p class="alert alert-info" role="status">{{ message }}</p>
  <a class="button" href="{{ url_for('login') }}">ログインへ</a>
  <div class="auth-links">
    <a href="{{ url_for('resend_verification') }}">認証メールを再送する</a>
    <a href="{{ url_for('forgot_password') }}">パスワードを再設定する</a>
  </div>
</section>
{% endblock %}
