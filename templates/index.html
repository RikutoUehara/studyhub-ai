<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="pR0LN6meuqwCcDz47ntCnNfO2r_h2zi88t_JOrbiJdA" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>単位トルトル君</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="index">
      <h1>単位トルトル君</h1>
      <p>大学生のためのAI学習支援システム</p>

      {% if current_user.is_authenticated %}
        <a href="{{ url_for('course')}}" class="button"> 学習を始める </a>
        {% include '_ai_usage.html' %}
      {% else %}
        <a href="{{ url_for('login') }}" class="button">ログインして学習を始める</a>
        <p><a href="{{ url_for('register') }}">新規登録</a></p>
      {% endif %}

      {% include '_public_links.html' %}

      {% if current_user.is_authenticated %}
      <div class="logout-area">
        <form method="POST" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ security_csrf_token() }}"><button type="submit">ログアウト</button></form>
      </div>
      {% endif %}
    </div>
  </body>
</html>
