<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <title>講義一覧</title>
  </head>

  <body>
    <div class="lecture">
      <h1>{{ course.name }}</h1>

      <h2>講義一覧</h2>

      {% for lecture in lectures %}
      <div class="lecture-item">
        <span>第{{ lecture.week }}回</span>

        <div class="lecture-actions">
          {% if latest_scores[lecture.id] is not none %}
          <span class="lecture-score">
            最新得点率：{{ latest_scores[lecture.id] }}%
          </span>
          {% else %}
          <span class="lecture-score"> 未実施 </span>
          {% endif %} {% if lecture.pdf_filename %}

          <a href="{{ url_for('upload_lecture', lecture_id=lecture.id) }}">
            <button>AI分析を見る</button>
          </a>

          {% else %}

          <a href="{{ url_for('upload_lecture', lecture_id=lecture.id) }}">
            <button>PDFアップロード</button>
          </a>

          {% endif %}
        </div>
      </div>
      {% endfor %}
    </div>
  </body>
</html>
