<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>新規登録</title>
  </head>
  <body>
    <h1>新規登録</h1>

    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ auth_csrf_token() }}" />
      <div>
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div>
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" minlength="8" maxlength="128" autocomplete="new-password" required />
      </div>

      <p>パスワードは8〜128文字。登録後にメール認証が必要です。</p>
      <p>登録前に<a href="{{ url_for('terms') }}">利用規約</a>と<a href="{{ url_for('privacy') }}">プライバシーポリシー</a>をご確認ください。登録することで利用規約に同意したものとします。</p>
      <button type="submit">登録</button>
    </form>
    <p><a href="{{ url_for('forgot_password') }}">パスワードを忘れた方</a></p>
    <p><a href="{{ url_for('resend_verification') }}">認証メールを再送する</a></p>
    <p><a href="{{ url_for('login') }}">ログイン</a></p>
    {% include '_public_links.html' %}
  </body>
</html>
