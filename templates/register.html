<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>新規登録</title>
  </head>
  <body>
    <h1>新規登録</h1>

    <form method="POST">
      <div>
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div>
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" required />
      </div>

      <button type="submit">登録</button>
    </form>
  </body>
</html>
